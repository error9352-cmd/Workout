<style id="design-system-v5">
/* ===== Design system consistency — tahap 5 ===== */
:root{
  --bg:#080D17;--card:#111A2A;--navy:#17243A;--line:rgba(148,163,184,.16);
  --ink:#F1F5FC;--mute:#94A3B8;--blue:#397BFF;--blue2:#78A9FF;
  --surface-raised:#18243A;--radius-card:20px;--radius-control:13px;
  --shadow-card:0 12px 30px rgba(0,0,0,.16);
  --ease: cubic-bezier(.2,.75,.25,1);
}
html{background:var(--bg);scroll-behavior:smooth}
body{background:radial-gradient(ellipse at 50% -18%,rgba(47,123,255,.10),transparent 48%),var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
main{width:100%;min-width:0}
#app,.pgv,main>*{min-width:0}
.card,.stat{border:1px solid var(--line);box-shadow:var(--shadow-card)}
.card{border-radius:var(--radius-card);padding:clamp(15px,2vw,20px);}
.card h2{line-height:1.12;letter-spacing:.015em}
.hero{background:linear-gradient(145deg,rgba(54,111,221,.18),rgba(17,26,42,.96) 64%);border-color:rgba(100,157,255,.22)}
.stat{background:linear-gradient(150deg,rgba(255,255,255,.035),transparent 70%),var(--card);border-radius:17px;padding:14px;min-width:0}
.stat .num{font-variant-numeric:tabular-nums;letter-spacing:0}
.sub,.mute,.prev,.empty{color:var(--mute)}
.btn,.ok,.chip,.tab,button,select,input{touch-action:manipulation}
.btn{border-radius:14px;letter-spacing:.02em;box-shadow:0 5px 14px rgba(47,123,255,.16);transition:transform .16s var(--ease),filter .16s var(--ease),box-shadow .16s var(--ease)}
.btn.ghost{border:1px solid var(--line);box-shadow:none;background:var(--surface-raised)}
.ok{border:1px solid var(--line);border-radius:12px;transition:background .16s,border-color .16s,transform .16s}
.chip{border-color:var(--line);background:var(--surface-raised);transition:background .16s,border-color .16s,color .16s}
.chip[aria-current=true]{box-shadow:0 4px 12px rgba(47,123,255,.18)}
input,select,textarea{border:1px solid var(--line);border-radius:var(--radius-control);background:#121E32;color:var(--ink);min-width:0;max-width:100%;transition:border-color .16s,box-shadow .16s}
input::placeholder,textarea::placeholder{color:#71819B;opacity:1}
label{line-height:1.35}
button:disabled{opacity:.48;cursor:not-allowed}
:where(button,a,input,select,textarea,[tabindex]):focus-visible{outline:2px solid var(--blue2);outline-offset:3px}
nav{background:rgba(10,16,28,.94);border-top:1px solid rgba(148,163,184,.18);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.tab{transition:color .16s,transform .16s}
.tab[aria-current=page]{font-weight:700}
.row{border-color:var(--line);align-items:center}
svg{overflow:visible}
img{max-width:100%}
/* Keep dense data and forms from forcing horizontal overflow. */
.grid,.gal,.cmp,.erow,.set{min-width:0}
.grid{gap:10px}
.set{gap:8px}
@media(hover:hover){.btn:not(:disabled):hover{filter:brightness(1.08);transform:translateY(-1px);box-shadow:0 8px 18px rgba(47,123,255,.2)}.ok:not(:disabled):hover{border-color:rgba(120,169,255,.45)}.chip:hover{border-color:rgba(120,169,255,.5)}}
@media(max-width:380px){
  main{padding-left:12px;padding-right:12px}
  .card{padding:14px;border-radius:17px}
  .grid{gap:7px}
  .stat{padding:10px;border-radius:14px}
  .stat .num{font-size:clamp(25px,8vw,32px)}
  .set{grid-template-columns:22px minmax(0,1fr) minmax(0,1fr) 72px;gap:5px}
  .set input{font-size:18px;padding:10px 3px}
  .set .ok{font-size:16px}
}
@media(min-width:700px){
  body{padding-bottom:36px}
  .card{margin-top:0}
  .hero{min-height:100%}
  nav{box-shadow:0 -8px 28px rgba(0,0,0,.18)}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}
}

</style>
<style id="responsive-device-refinement-v7">
/* ===== Tahap 7: responsive refinement — phone, tablet, laptop ===== */
html,body{width:100%;max-width:100%;overflow-x:hidden}
*,*::before,*::after{box-sizing:border-box}
img,svg,canvas,video{max-width:100%}
main,#app,.pgv,.card,.hero,.row,.f,.grid,.gal,.cmp,.set,.sheet{min-width:0}

/* Phone: 320–599px — one clear column, comfortable touch targets */
@media (max-width:599px){
  body{padding-left:0!important;padding-right:0!important;padding-bottom:calc(78px + env(safe-area-inset-bottom,0px))!important}
  main{width:100%;max-width:100%;padding:14px 14px calc(92px + env(safe-area-inset-bottom,0px));margin:0}
  body:not(.wk) #app,.pgv{display:flex;flex-direction:column;gap:13px;width:100%;min-width:0}
  body:not(.wk) #app>*,.pgv>*{width:100%;max-width:100%;min-width:0;margin-top:0}
  h1{font-size:clamp(30px,8vw,42px);line-height:1.04;overflow-wrap:anywhere}
  h2{font-size:clamp(17px,4.8vw,21px)}
  .card,.dashboard-view>.card,.dashboard-view .dashboard-card,.pgv>section.card{padding:15px;border-radius:17px}
  .card.hero{display:flex;flex-wrap:wrap;gap:9px;padding:17px;min-height:0}
  .card.hero>.btn{width:100%;max-width:none;flex:1 1 100%;min-height:46px;margin:3px 0 0}
  .dashboard-stats,.pgv>.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
  .dashboard-stats .stat,.pgv>.grid .stat{min-width:0;padding:10px 8px;min-height:88px}
  .dashboard-stats .num,.pgv>.grid .num{font-size:clamp(21px,6.5vw,29px);overflow-wrap:anywhere}
  .dashboard-stats small,.pgv>.grid small{font-size:10px;line-height:1.25}
  .dashboard-lower{grid-template-columns:minmax(0,1fr);gap:10px}
  .profile-overview,.profile-details{grid-template-columns:minmax(0,1fr);gap:11px}
  .profile-overview>.card:first-child,.profile-details .profile-device-card{grid-column:auto}
  .profile-overview .thm{grid-template-columns:repeat(2,minmax(0,1fr))}
  .profile-details .gal{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pgv>.chips,.chips{max-width:100%;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
  .pgv>.chips::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
  .pgv>.chips .chip,.chips .chip{flex:0 0 auto;min-height:40px}
  .dpick{max-width:100%;overflow-x:auto}
  .f{gap:8px;flex-wrap:wrap}
  .f>*{min-width:0;max-width:100%}
  input,select,textarea{font-size:16px;min-height:44px}
  button,.btn,.ok,.tab{min-height:42px}
  .sheetbg{align-items:flex-end;padding:0}
  .sheet,.sheet.xs{width:100%;max-width:100%;max-height:90dvh;border-radius:22px 22px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
  .grab{display:block}
  nav{left:0;right:0;bottom:0;top:auto;width:100%;max-width:100%;padding:7px 8px calc(7px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-around;gap:3px;overflow-x:auto}
  nav .tab{flex:1 1 0;min-width:0;min-height:54px;padding:5px 2px;gap:3px;font-size:10px;white-space:normal}
  nav .tab svg{width:21px;height:21px;flex:none}
  .toast,.prpop{left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));max-width:none}
  body .rest{left:12px;right:12px;bottom:calc(74px + env(safe-area-inset-bottom,0px));max-width:none}
}

/* Small phones: avoid squeezed stat cards and workout set controls */
@media (max-width:379px){
  main{padding-left:11px;padding-right:11px}
  .dashboard-stats .stat,.pgv>.grid .stat{padding:9px 6px;min-height:82px}
  .dashboard-stats small,.pgv>.grid small{font-size:9px}
  .profile-overview .thm{grid-template-columns:minmax(0,1fr)}
  body.wk .slide .card{padding:11px}
  body.wk .slide .set.sh,body.wk .slide .set.set{grid-template-columns:30px minmax(0,1fr) minmax(0,1fr) 76px;gap:4px}
  body.wk .slide .set.set input{font-size:17px}
  body.wk .slide .set.set .ok{font-size:14px}
  nav .tab{font-size:9px}
}

/* Tablet portrait: 600–1023px — balanced two-column dashboard, centered content */
@media (min-width:600px) and (max-width:1023px) and (orientation:portrait){
  body{padding-left:0!important;padding-bottom:calc(82px + env(safe-area-inset-bottom,0px))!important}
  main{width:100%;max-width:900px;padding:24px 24px calc(104px + env(safe-area-inset-bottom,0px));margin:0 auto}
  body:not(.wk) #app{grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
  body:not(.wk) #app>*{min-width:0}
  body:not(.wk) #app>h1,body:not(.wk) #app>h1+.sub,body:not(.wk) #app>.chips,body:not(.wk) #app>.week,body:not(.wk) #app>.dpick,body:not(.wk) #app>.startdock,body:not(.wk) #app>.grid{grid-column:1/-1}
  body:not(.wk) #app>section.card{grid-column:span 1}
  body:not(.wk) #app>.card.hero{grid-column:1/-1}
  .pgv{grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
  .pgv>h1,.pgv>.chips,.pgv>.grid{grid-column:1/-1}
  .pgv>section.card:first-of-type{grid-column:1/-1}
  .profile-overview{grid-template-columns:repeat(2,minmax(0,1fr))}
  .profile-overview>.card:first-child{grid-column:1/-1}
  .profile-details{grid-template-columns:repeat(2,minmax(0,1fr))}
  nav{left:0;right:0;bottom:0;top:auto;width:100%;padding:8px 7vw calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:10px}
  nav .tab{flex:0 1 110px;min-width:72px;min-height:58px}
  .sheetbg{padding:18px}
  .sheet{width:min(640px,100%);max-height:90dvh}
}

/* Tablet landscape and compact laptops: 600–1279px wide landscape */
@media (min-width:600px) and (max-width:1279px) and (orientation:landscape){
  main{width:100%;max-width:1100px;padding:20px 26px 42px;margin:0 auto}
  body:not(.wk) #app{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
  body:not(.wk) #app>h1,body:not(.wk) #app>h1+.sub,body:not(.wk) #app>.chips,body:not(.wk) #app>.week,body:not(.wk) #app>.dpick,body:not(.wk) #app>.startdock,body:not(.wk) #app>.grid{grid-column:1/-1}
  body:not(.wk) #app>.card.hero{grid-column:1/-1}
  .pgv{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
  .pgv>h1,.pgv>.chips,.pgv>.grid{grid-column:1/-1}
  .pgv>section.card:first-of-type{grid-column:1/-1}
  body.wk .slide .card{grid-template-columns:minmax(230px,.85fr) minmax(300px,1.15fr);gap:20px}
}

/* Laptop / desktop: sidebar layout with controlled content width */
@media (min-width:1024px){
  main{width:100%;max-width:1240px;margin:0 auto;padding-top:26px;padding-bottom:52px}
  body:not(.wk) #app{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
  body:not(.wk) #app>h1,body:not(.wk) #app>h1+.sub,body:not(.wk) #app>.chips,body:not(.wk) #app>.week,body:not(.wk) #app>.dpick,body:not(.wk) #app>.startdock,body:not(.wk) #app>.grid{grid-column:1/-1}
  body:not(.wk) #app>.card.hero{grid-column:1/-1}
  .pgv{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
  .pgv>h1,.pgv>.chips,.pgv>.grid{grid-column:1/-1}
  .pgv>section.card:first-of-type{grid-column:span 1}
  .profile-overview{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) minmax(210px,.85fr)}
  .profile-details{grid-template-columns:repeat(2,minmax(0,1fr))}
  nav .tab{white-space:normal}
}

@media (min-width:1440px){
  main{max-width:1380px}
  body:not(.wk) #app{grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
  body:not(.wk) #app>h1,body:not(.wk) #app>h1+.sub,body:not(.wk) #app>.chips,body:not(.wk) #app>.week,body:not(.wk) #app>.dpick,body:not(.wk) #app>.startdock,body:not(.wk) #app>.grid{grid-column:1/-1}
  body:not(.wk) #app>.card.hero{grid-column:span 2}
  .pgv{grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
  .pgv>h1,.pgv>.chips,.pgv>.grid{grid-column:1/-1}
  .pgv>section.card:first-of-type{grid-column:span 1}
}

/* Active workout: maintain usable two-column form only when there is enough width */
@media (min-width:700px) and (max-width:859px){
  body.wk .slide .card{display:block}
  body.wk .slide .wl,body.wk .slide .wr{display:block;min-width:0}
  body.wk .slide .exw{max-width:100%}
  body.wk .slide .exw .exi{width:100%;height:clamp(180px,28vh,260px);object-fit:contain}
}
@media (max-width:699px){
  body.wk main{height:auto;min-height:100dvh;padding-top:10px;padding-bottom:20px}
  body.wk .slide .card{display:block}
  body.wk .slide .wl,body.wk .slide .wr{display:block;min-width:0}
  body.wk .slide .exw{max-width:100%}
  body.wk .slide .exw .exi{width:100%;height:clamp(160px,32vh,250px);object-fit:contain}
}

</style>

<style id="ui-refinement-v10">

  padding:clamp(12px,3vw,28px) !important;

<style id="compact-social-notifications">
/* Compact WhatsApp/Instagram-style notifications on phones.
   Clear old top+bottom constraints that caused fixed notifications to stretch. */
@media (max-width: 600px){
  #toast.toast,
  .toast,
  .prpop{
    position:fixed !important;
    top:auto !important;

<style id="workout-scroll-fix-v14">
/* ===== v14: Workout scrolling fix =====
   Use the document as the scroll container instead of locking body/main and
   creating a nested .slide scroller. This avoids mobile scroll handoff/freezes
   while preserving the workout header, controls, and bottom navigation. */
body.wk{
  overflow-x:hidden !important;
  overflow-y:auto !important;
  padding-bottom:calc(92px + env(safe-area-inset-bottom,0px)) !important;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-y:auto;
}
body.wk main{
  height:auto !important;
  min-height:100dvh !important;
  overflow:visible !important;
}
body.wk .stick{
  position:sticky !important;
  top:env(safe-area-inset-top,0px) !important;
  z-index:20 !important;
}
body.wk .slide{
  flex:initial !important;
  min-height:0 !important;
  height:auto !important;
  max-height:none !important;
  overflow:visible !important;
  overscroll-behavior:initial !important;
  -webkit-overflow-scrolling:auto !important;
  will-change:auto !important;
}
body.wk .slide.in-r,body.wk .slide.in-l{
  animation:none !important;
}
body.wk main>.f,body.wk main>[data-cancel]{
  flex:none !important;
}

<style id="global-design-system-v28">
/* ===== v28: Global Design System + Final Frontend Audit ===== */
:root{
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;
  --radius-sm:10px;--radius-md:14px;--radius-lg:18px;--radius-xl:22px;
  --focus:rgba(106,162,255,.38);
}
*{-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{min-width:320px;overflow-x:hidden}
button,input,select,textarea{font-family:inherit}
button{touch-action:manipulation}
button:disabled{cursor:not-allowed}

/* Consistent type hierarchy */
body:not(.wk) h1{font-size:clamp(29px,5vw,36px);line-height:1.08;letter-spacing:-.025em}
body:not(.wk) h2{letter-spacing:-.01em}
body:not(.wk) .sub{line-height:1.45}
body:not(.wk) p{max-width:78ch}

/* Consistent surfaces without flattening existing feature-specific cards */
body:not(.wk) .card{
  border:1px solid rgba(148,163,184,.11);
  border-radius:var(--radius-lg);
}
body:not(.wk) .card h2{line-height:1.15}
body:not(.wk) .stat{
  border:1px solid rgba(148,163,184,.10);
  border-radius:var(--radius-md);
}

/* Unified controls */
body:not(.wk) .btn,
body:not(.wk) .ok,
body:not(.wk) .pk,
body:not(.wk) .chip,
body:not(.wk) select,
body:not(.wk) input{
  transition:background-color .16s ease,border-color .16s ease,box-shadow .16s ease,transform .08s ease,opacity .16s ease;
}
body:not(.wk) .btn{
  min-height:50px;
  border-radius:var(--radius-md);
  font-size:20px;
  letter-spacing:.01em;
}
body:not(.wk) .btn.sm{min-height:44px;font-size:16px}
body:not(.wk) .btn.ghost{border:1px solid rgba(148,163,184,.12)}
body:not(.wk) .ok{min-height:46px;border-radius:var(--radius-md)}
body:not(.wk) .pk{border-radius:var(--radius-md)}
body:not(.wk) .chip{min-height:42px;border-radius:999px}
body:not(.wk) input,body:not(.wk) select{min-height:46px}
body:not(.wk) input:focus-visible,body:not(.wk) select:focus-visible,
body:not(.wk) .btn:focus-visible,body:not(.wk) .ok:focus-visible,
body:not(.wk) .pk:focus-visible,body:not(.wk) .chip:focus-visible{
  outline:2px solid var(--blue2);outline-offset:2px;box-shadow:0 0 0 4px var(--focus)
}
body:not(.wk) .btn:hover{filter:brightness(1.04)}
body:not(.wk) .btn.ghost:hover,body:not(.wk) .ok:hover,body:not(.wk) .pk:hover,body:not(.wk) .chip:hover{border-color:rgba(106,162,255,.45)}
body:not(.wk) .btn:active,body:not(.wk) .ok:active,body:not(.wk) .pk:active,body:not(.wk) .chip:active{transform:scale(.985)}

/* Navigation: stable, readable, touch-safe */
nav{min-height:64px;padding-top:5px}
.tab{min-height:50px;border-radius:12px}
.tab[aria-current=page]{font-weight:700}
.tab:focus-visible{outline:2px solid var(--blue2);outline-offset:-2px}

/* Horizontal controls never create page-width overflow */
.chips{min-width:0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}

/* Reusable section rhythm */
body:not(.wk) main>h1{margin-bottom:2px}
body:not(.wk) main>.sub{margin-bottom:2px}
body:not(.wk) main>.card:first-of-type{margin-top:14px}
body:not(.wk) .f{align-items:stretch}
body:not(.wk) .f .btn{min-width:0}

/* Empty states and secondary text */
body:not(.wk) .empty{border-radius:var(--radius-md)}
body:not(.wk) .prev{line-height:1.45}

/* Mobile: prioritize one-handed use and avoid cramped controls */
@media(max-width:699px){
  body:not(.wk){padding-bottom:calc(78px + env(safe-area-inset-bottom,0px))}
  body:not(.wk) main{padding:16px 14px 20px}
  body:not(.wk) .card{padding:15px}
  body:not(.wk) .btn{min-height:52px}
  body:not(.wk) .f{gap:7px}
  body:not(.wk) .f .btn{flex:1}
  nav{padding-left:4px;padding-right:4px}
  .tab{font-size:12px}
}

/* Very small screens: preserve readable tap targets */
@media(max-width:380px){
  body:not(.wk) main{padding-left:12px;padding-right:12px}
  body:not(.wk) .card{padding:14px;border-radius:16px}
  body:not(.wk) .btn{font-size:18px}
  body:not(.wk) .chip{padding-left:13px;padding-right:13px}
  .tab{font-size:11px}
}

/* Workout keeps its compact, information-dense layout; only interaction safety is normalized. */
body.wk .btn:focus-visible,body.wk .ok:focus-visible,body.wk .chip:focus-visible,
body.wk input:focus-visible,body.wk select:focus-visible,body.wk button:focus-visible{
  outline:2px solid var(--blue2);outline-offset:2px;box-shadow:0 0 0 3px var(--focus)
}
body.wk input,body.wk select{font-family:inherit}
body.wk .ok,body.wk .btn{touch-action:manipulation}

/* Prevent accidental horizontal expansion from long values */
.card,.stat,.profilev,.pgv,.dashboard-view,.historyv{min-width:0;overflow-wrap:break-word}

/* Motion audit */
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>

<style id="final-frontend-css-v40">/* ===== v40: Final Frontend Layout System =====
